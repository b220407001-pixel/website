<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Surprise | Deliver Emotions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card:hover { transform: translateY(-10px); transition: 0.3s; }
        .pink-gradient { background: linear-gradient(135deg, #FF0080 0%, #FF8C00 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white/90 backdrop-blur-md fixed w-full z-50 border-b border-pink-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-2xl font-black text-pink-600">Midnight Surprise</span>
            <a href="https://wa.me/8801814790752" class="bg-pink-600 text-white px-6 py-2 rounded-full font-bold">Order Now</a>
        </div>
    </nav>

    <header class="pt-32 pb-20 px-6 text-center pink-gradient text-white">
        <h1 class="text-5xl font-extrabold mb-4">Deliver Love While They Dream.</h1>
        <p class="opacity-90">মাঝরাতের বিশেষ মুহূর্তগুলোকে স্মরণীয় করে তুলুন।</p>
    </header>

    <section class="py-20 container mx-auto px-6">
        <h2 class="text-3xl font-bold text-center mb-12">Our Gift Collection</h2>
        
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <p class="text-center col-span-full py-10">Loading gifts... please wait.</p>
        </div>
        
        <div id="error-box" class="hidden mt-10 p-4 bg-red-100 text-red-700 rounded-xl text-center"></div>
    </section>

    <script>
        // আপনার .env থেকে নেওয়া আসল মানগুলো
        const URL = 'https://eckhljjdizrnaytchoka.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVja2hsampkaXpybmF5dGNob2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MTEzMjQsImV4cCI6MjA4NzA4NzMyNH0.YNnrcKnvCCiWQWgsLC2qfGmXJ1vDHm4whlGwT5V6sKA';

        const supabaseClient = supabase.createClient(URL, KEY);

        async function getGifts() {
            const { data, error } = await supabaseClient.from('products').select('*');

            if (error) {
                console.error(error);
                // যদি নিরাপত্তা তালা বা অন্য সমস্যা থাকে তবে সাইটেই সেটা দেখা যাবে
                document.getElementById('error-box').classList.remove('hidden');
                document.getElementById('error-box').innerHTML = `Error: ${error.message}. <br> সুপাবেসে RLS Policy এনাবল করুন।`;
                return;
            }

            const list = document.getElementById('product-list');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center">আপনার ডাটাবেসে কোনো প্রোডাক্ট নেই। দয়া করে সুপাবেসে ডাটা অ্যাড করুন।</p>';
                return;
            }

            data.forEach(item => {
                list.innerHTML += `
                    <div class="product-card bg-white rounded-3xl p-5 shadow-lg border border-slate-100">
                        <img src="${item.image_url || 'https://via.placeholder.com/300'}" class="w-full h-64 object-cover rounded-2xl mb-4">
                        <h3 class="text-xl font-bold mb-2">${item.name}</h3>
                        <p class="text-slate-500 text-sm mb-4">${item.description}</p>
                        <div class="flex justify-between items-center pt-4 border-t">
                            <span class="text-2xl font-bold text-pink-600">৳${item.price}</span>
                            <a href="https://wa.me/8801814790752?text=I want to order ${item.name}" class="bg-slate-900 text-white px-5 py-2 rounded-xl font-bold">Buy Now</a>
                        </div>
                    </div>`;
            });
        }
        window.onload = getGifts;
    </script>
</body>
</html>
